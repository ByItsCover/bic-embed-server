name: docker-deploy

on:
  workflow_dispatch:
  push:
    branches: ["master"]

permissions:
  id-token: write
  contents: read

jobs:
  check-changes:
    name: Check for Changes
    runs-on: ubuntu-latest

    outputs:
      should_deploy: ${{ steps.filter.outputs.src }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Paths Filter
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            src:
              - '!terraform/**'
              - '!.github/workflows/**'
              - '!**.md'

  deploy:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: check-changes
    if: needs.check-changes.outputs.should_deploy == 'true'

    env:
      AWS_ECR_REPO: embed-server

    steps:
      - name: Docker Build
        run: docker build -t ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.AWS_ECR_REPO }} .

      - name: Configure AWS Credentials for github actions
        uses: aws-actions/configure-aws-credentials@v4.0.2
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_GITHUB_ROLE }}

      - name: Docker Login
        run: |
          aws ecr get-login-password \
              --region ${{ secrets.AWS_REGION }} \
          | docker login \
              --username AWS \
              --password-stdin ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Docker Push
        run: docker push ${{ secrets.AWS_ACCOUNT }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ env.AWS_ECR_REPO }}
